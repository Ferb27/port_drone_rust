[workspace]
resolver = "2"
members = ["crates/de_common", "crates/de_mavlink", "crates/de_comm"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
authors = ["Ferb27 <Ferb27@users.noreply.github.com>"]
license = "MIT"
publish = false

[workspace.dependencies]
de_common = { path = "crates/de_common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
# NOTE: no "preserve_order". The C++ modules use plain nlohmann::json, whose
# objects are std::map (keys sorted). serde_json's default BTreeMap gives the
# same byte-for-byte key order. See AGENTS.md section 5.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
mavlink = { version = "0.21", default-features = false, features = ["std", "tokio", "transport-tcp", "transport-udp", "transport-direct-serial", "dialect-ardupilotmega", "mav2-message-extensions"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
# dev only
flate2 = "1"
base64 = "0.22"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
